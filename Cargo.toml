[package]
name = "pokechamp-agent2"
version = "0.1.0"
edition = "2024"
default-run = "pokechamp-agent2"
[dependencies]
nokhwa = { version = "0.10", features = ["input-native", "camera-sync-impl"] }
eframe = "=0.33.0"
egui = "=0.33.0"
anyhow = "1"
crossbeam-channel = "0.5"
cpal = "0.15"
ringbuf = "0.4"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
image = "0.25.10"
ort = { version = "2.0.0-rc.13", features = ["ndarray"] }
ndarray = "0.17"
serde_json = "1"
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Foundation",
    "Globalization",
    "Graphics_Imaging",
    "Media_Ocr",
    "Storage_Streams",
] }
